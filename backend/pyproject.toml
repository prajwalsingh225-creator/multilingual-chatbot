[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kartik Sharma", email = "kartik.28520@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "langdetect>=1.0.9",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.1.1",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
